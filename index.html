<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SR ePrint Online</title>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 40px 20px;
    }

    .box {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.12);
    }

    h1 {
      margin-bottom: 10px;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      margin: 20px;
    }

    button {
      background: #1677ff;
      color: white;
      border: none;
      padding: 14px 30px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>SR ePrint Online</h1>

    <p>Digital PDF File</p>

    <div class="price">₹99</div>

    <button id="payButton" onclick="payNow()">
      Pay ₹99 & Download PDF
    </button>

    <div id="message"></div>
  </div>

  <script>
    async function payNow() {

      const button = document.getElementById("payButton");
      const message = document.getElementById("message");

      button.disabled = true;
      message.innerText = "Please wait...";

      try {

        // Create Razorpay order
        const response = await fetch("/api/create-order", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            amount: 99
          })
        });

        const order = await response.json();

        if (!response.ok) {
          throw new Error(order.error || "Order creation failed");
        }

        const options = {

          key: order.key_id,

          amount: order.amount,

          currency: "INR",

          name: "SR ePrint Online",

          description: "PDF File",

          order_id: order.id,

          handler: async function (payment) {

            message.innerText = "Verifying payment...";

            const verifyResponse = await fetch(
              "/api/verify-payment",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify(payment)
              }
            );

            const result = await verifyResponse.json();

            if (result.success) {

              message.innerText =
                "Payment successful! Downloading PDF...";

              window.location.href = result.download_url;

            } else {

              message.innerText =
                "Payment verification failed.";

              button.disabled = false;
            }
          },

          prefill: {
            name: "",
            email: "",
            contact: ""
          },

          theme: {
            color: "#1677ff"
          },

          modal: {
            ondismiss: function () {
              button.disabled = false;
              message.innerText = "";
            }
          }
        };

        const razorpay = new Razorpay(options);

        razorpay.open();

      } catch (error) {

        console.error(error);

        message.innerText =
          "Something went wrong. Please try again.";

        button.disabled = false;
      }
    }
  </script>

</body>
</html>
